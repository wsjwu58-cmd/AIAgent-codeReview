name: Run Tests

on:
  push:
    branches: [master, main, develop, dev, 'feature/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [master, main]

env:
  DB_USERNAME: root
  DB_PASSWORD: qwer1234
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  REDIS_USERNAME: ''
  REDIS_PASSWORD: ''
  MILVUS_HOST: localhost
  MILVUS_PORT: '19530'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: 'https://api.siliconflow.cn'

jobs:
  unit-test:
    name: Unit Tests (Java 17)
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test all modules except start (pure unit tests)
        run: mvn test --batch-mode --no-transfer-progress -pl '!code-review-start'
      - name: Test start module (skip eval suite)
        run: mvn test --batch-mode --no-transfer-progress -pl code-review-start -Dtest='!AgentEvaluationSuiteTest' -Dsurefire.failIfNoSpecifiedTests=false

  integration-test:
    name: Integration Tests (with services)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qwer1234
          MYSQL_DATABASE: code_review_agent
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=5

      milvus:
        image: milvusdb/milvus:v2.3.4
        env:
          COMMON_STORAGETYPE: local
        ports:
          - 19530:19530
          - 9091:9091
        options: --health-cmd="curl -sf http://localhost:9091/healthz" --health-interval=30s --health-timeout=20s --health-retries=10 --health-start-period=120s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Wait for MySQL and Redis
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 20); do
            mysqladmin ping -h 127.0.0.1 -u root -pqwer1234 --silent 2>/dev/null && break
            sleep 3
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 10); do
            redis-cli -h 127.0.0.1 ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
      - name: Wait for Milvus
        timeout-minutes: 5
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9091/healthz 2>/dev/null; then
              echo "Milvus is ready!"
              exit 0
            fi
            echo "Milvus attempt $i/30, waiting..."
            sleep 10
          done
          echo "=== Milvus logs ==="
          docker logs $(docker ps -q --filter ancestor=milvusdb/milvus:v2.3.4) 2>/dev/null || true
          echo "Milvus startup timed out" && exit 1
      - name: Run evaluation tests
        run: mvn test --batch-mode --no-transfer-progress -pl code-review-start -Dtest='AgentEvaluationSuiteTest' -Dspring.profiles.active=eval -Dsurefire.failIfNoSpecifiedTests=false
