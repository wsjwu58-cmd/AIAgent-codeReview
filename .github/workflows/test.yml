name: Run Tests

on:
  push:
    branches: [master, main, develop, dev, 'feature/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [master, main]

jobs:
  # ==================================================================
  # 单元测试：不依赖外部服务，纯 Java 代码测试
  # ==================================================================
  unit-test:
    name: Unit Tests (Java 17)
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test core/rag/tools/api/common modules
        run: mvn test --batch-mode --no-transfer-progress -pl '!code-review-start'

      - name: Test start module (skip SpringBootTest context loads)
        run: |
          mvn test -am --batch-mode --no-transfer-progress \
            -pl code-review-start \
            -Dtest='!AgentEvaluationSuiteTest,!CodeReviewApplicationTests,!CodeReviewStartApplicationTests' \
            -Dsurefire.failIfNoSpecifiedTests=false

  # ==================================================================
  # 集成/Eval 测试：MySQL + Redis + Milvus + OpenAI API
  #
  # Milvus 需要在机器上有充足的资源（>8GB 内存）。
  # GitHub 免费 runner (2 核 7GB) 经常启动超时。
  # 如果 Milvus 启动失败，eval 测试会被优雅跳过。
  # 要稳定运行此 job，请使用 GitHub paid runner 或自托管 runner。
  # ==================================================================
  integration-test:
    name: Integration Tests (MySQL + Redis + Milvus)
    runs-on: ubuntu-latest

    env:
      DB_USERNAME: root
      DB_PASSWORD: qwer1234
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      MILVUS_HOST: localhost
      MILVUS_PORT: '19530'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: 'https://api.siliconflow.cn'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qwer1234
          MYSQL_DATABASE: code_review_agent
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Milvus
        run: |
          docker run -d --name milvus-ci \
            -p 19530:19530 \
            -p 9091:9091 \
            milvusdb/milvus:v2.3.4 \
            milvus run standalone

      - name: Wait for services
        timeout-minutes: 3
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -pqwer1234 --silent 2>/dev/null && break
            sleep 3
          done
          for i in $(seq 1 10); do
            redis-cli -h 127.0.0.1 ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          echo "MySQL & Redis ready"

      - name: Wait for Milvus (may skip on free runner)
        id: milvus
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for i in $(seq 1 48); do
            if curl -sf http://localhost:9091/healthz 2>/dev/null; then
              echo "milvus_ready=true" >> $GITHUB_OUTPUT
              echo "Milvus ready (attempt $i)"
              exit 0
            fi
            sleep 10
          done
          echo "milvus_ready=false" >> $GITHUB_OUTPUT
          echo "Milvus did not start — eval tests will be skipped"

      - name: Run evaluation tests
        run: |
          if [ "${{ steps.milvus.outputs.milvus_ready }}" != "true" ]; then
            echo "::warning::Skipping eval tests: Milvus requires >8GB RAM, free runner has 7GB"
            exit 0
          fi
          mvn test -am --batch-mode --no-transfer-progress \
            -pl code-review-start \
            -Dtest='AgentEvaluationSuiteTest' \
            -Dspring.profiles.active=eval \
            -Dsurefire.failIfNoSpecifiedTests=false
