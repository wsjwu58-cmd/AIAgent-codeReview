name: Run Tests

on:
  push:
    branches: [master, main, develop, dev, 'feature/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [master, main]

env:
  DB_USERNAME: root
  DB_PASSWORD: qwer1234
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  REDIS_USERNAME: ''
  REDIS_PASSWORD: ''
  MILVUS_HOST: localhost
  MILVUS_PORT: '19530'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: 'https://api.siliconflow.cn'

jobs:
  unit-test:
    name: Unit Tests (Java 17)
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test all modules except start (pure unit tests)
        run: mvn test --batch-mode --no-transfer-progress -pl '!code-review-start'
      - name: Test start module (skip eval suite)
        run: mvn test --batch-mode --no-transfer-progress -pl code-review-start -Dtest='!AgentEvaluationSuiteTest' -Dsurefire.failIfNoSpecifiedTests=false

  integration-test:
    name: Integration Tests (with services)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qwer1234
          MYSQL_DATABASE: code_review_agent
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Milvus standalone
        run: |
          docker run -d --name milvus-standalone \
            --memory 4g \
            -p 19530:19530 \
            -p 9091:9091 \
            milvusdb/milvus:v2.3.4 \
            milvus run standalone

      - name: Wait for MySQL and Redis
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -pqwer1234 --silent 2>/dev/null; then
              echo "MySQL ready (attempt $i)"
              break
            fi
            sleep 3
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 10); do
            if redis-cli -h 127.0.0.1 ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready (attempt $i)"
              break
            fi
            sleep 2
          done

      - name: Wait for Milvus
        timeout-minutes: 5
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9091/healthz 2>/dev/null; then
              echo "Milvus ready (attempt $i)"
              exit 0
            fi
            echo "Milvus starting... attempt $i/30"
            sleep 10
          done
          echo "=== Milvus container logs ==="
          docker logs milvus-standalone 2>&1 | tail -50 || true
          echo "Milvus startup timed out"
          exit 1

      - name: Build all modules (install to local repo)
        run: mvn install --batch-mode --no-transfer-progress -DskipTests

      - name: Run evaluation test suite
        run: mvn test --batch-mode --no-transfer-progress -pl code-review-start -Dtest='AgentEvaluationSuiteTest' -Dspring.profiles.active=eval -Dsurefire.failIfNoSpecifiedTests=false
